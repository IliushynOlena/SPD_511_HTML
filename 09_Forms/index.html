<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        body{
            text-align: center;
            background-color: white;
            color: black;
            font-family: 'Courier New', Courier, monospace;
        }
        form{
            background-color: lightgray;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-radius: 6px;
            width: 60%;
            margin: auto;
            /* max-width: 700px; */
           
        }
        label{
            display: grid;
            grid-template-columns: 100px 1fr;
            align-items: center;
            margin: 10px;
        }
        label input{
            flex-grow: 1;
        }
        label input[type="color"]
        {
            width: 100%;
        }
        label input[type="checkbox"]
        {
           justify-self: left;
        }
        form h2, h3{
            text-align: center;
        }
        div {
            display: flex;
            justify-content:center;
        }
        input{
            background-color: blanchedalmond;
            border: none;
            padding: 5px;
            border-radius: 4px;
            transition: .3s;
        }
        input:focus{
            outline: none;
            background-color: rgb(242, 204, 147);
            box-shadow: 2px 2px 10px black;
        }
        button{
            background-color: rgb(120, 103, 85);
            color:white;
            border: none;
            margin: 5px;
            padding: 10px;
            width: 30%;
            border-radius: 3px;
            transition: 0.5s;
        }
        button:hover{
            box-shadow: 2px 2px 10px black;
        }
    </style>
</head>
<body>
    <h1>Working with Form</h1>
    <hr> 
    <form >
       <h2>My Form</h2>
    <!-- <label for="name-input" accesskey="n">Name : </label>
    <input type="text" id="name-input"> -->
    <label >Name : 
        <input type="text" placeholder="Enter your name" >
    </label>
    <label>Price : 
        <input type="number">
    </label>
    <label>Date : 
        <input type="date">        
    </label>
    <label>Time :
        <input type="time">        
    </label>
    <label>Color : 
        <input type="color">        
    </label>
    <label>Checkbox
        <input type="checkbox">              
    </label>
    <label>Tel :
        <input type="tel">        
    </label>
    <label>Email :
        <input type="email">        
    </label>
    <label>File :
        <input type="file">        
    </label>
    <label>Url :
        <input type="url">        
    </label>
    <h3>Delivery type</h3>
    <div>
        <label >Econom :
            <input type="radio" name="type_del">
        </label>
         <label >Standart :
            <input type="radio"  name="type_del">
        </label>
         <label >Fast :
            <input type="radio"  name="type_del">
        </label>
    </div>
    <label >Select : 
        <select >
            <option>Good</option>
            <option>Normal</option>
            <option selected>Exellent</option>
        </select>
    </label>
    <label >Volume :
        <input type="range"  >
    </label>
      <label >Teax area :
        <input type="text"  >
    </label>
    <div>
    <button type="button">Push me</button>
    <button type="reset">Reset</button>
    <button type="submit">Sumbit</button>
    </div>
  

    </form>
    
</body>
</html>
