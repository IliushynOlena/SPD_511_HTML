<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive Design</title>
    <style>
        body{
            font-family:Arial, Helvetica, sans-serif;
            text-transform: uppercase;
            font-weight: bold;

            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header{
            background-color: rgb(0, 221, 255);
            padding: 15px;
            text-align: center;
            flex-basis: 10%;
        }
        nav{
            background-color: rgb(0, 119, 255);
            padding: 10px;
             flex-basis: 10%;
        }
         .container{
            display: flex;
             flex-basis: 70%;
        }
        aside{
            background-color: bisque;
            padding: 10px;
        }
        main{
            background-color: azure;
            padding: 20px;
            flex-basis: 70%;
            height: 500px;
        }
         footer{
            background-color: rgb(252, 68, 105);
            padding: 10px;
             flex-basis: 10%;
        }
        aside:first-child{
            flex-basis: 10%;
        }
        aside:last-child{
            background-color: lightgray;
            flex-basis: 20%;
         
        }
        @media screen and (max-width:800px){
            aside:last-child{
                display: none;
            }
            main{
                flex-basis: 75%;
                
            }
            aside:first-child{
                flex-basis: 25%;
            }
        }
       @media screen and (max-width:600px) {

        .container{
            flex-direction: column;
        }
         aside:last-child{
                display: block;
            }
            main{
                order: -1;
            }
        
       }

    </style>
</head>
<body>
    <header>Header</header>
    <nav>Menu</nav>
    <div class="container">
        <aside>Left Block</aside>
        <main>Main content</main>
        <aside>Right Block</aside>
    </div>
    <footer>Footer</footer>
    
</body>
</html>
